# nginx DENTRO del contenedor web: sirve React y reenvía /api y /uploads
# al contenedor "api" por la red interna de Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hasta 8 fotos de 10 MB por envío
    client_max_body_size 80m;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        expires 7d;
    }

    # Archivos de Vite con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React Router (/admin, /admin/productos, ...)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
