# JM Seguridad y Tecnología — catálogo + panel administrativo.
#
# Este archivo va en el nginx DEL SISTEMA del VPS (no en Docker), junto a
# tus otros sitios (novaged.rusoft.dev, clinicnovaged.rusoft.dev, etc.):
#
#   sudo cp nginx/camarasjm.rusoft.dev.conf /etc/nginx/sites-available/camarasjm.rusoft.dev
#   sudo ln -s /etc/nginx/sites-available/camarasjm.rusoft.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d camarasjm.rusoft.dev
#
# certbot reescribe este archivo automáticamente para agregar el bloque
# HTTPS (443) y el redirect 80->443 — no hace falta escribirlo a mano.
#
# Todo (catálogo, /admin, /api y /uploads) va al contenedor "web", que a su
# vez reenvía /api y /uploads al backend por la red interna de Docker.
# El puerto 3110 debe coincidir con WEB_PORT del .env.

server {
    listen 80;
    server_name camarasjm.rusoft.dev;

    # Hasta 8 fotos de 10 MB por envío desde el panel
    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
